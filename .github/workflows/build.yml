name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  ARCLIGHT_REF: 166b9877e40eeec405097f416fc0ff2d23986313

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Arclight (${{ env.ARCLIGHT_REF }})
        uses: actions/checkout@v4
        with:
          repository: IzzelAliz/Arclight
          ref: ${{ env.ARCLIGHT_REF }}
          path: Arclight

      - name: Checkout PaperArc
        uses: actions/checkout@v4
        with:
          path: PaperArc

      # Arclight 源码：其构建系统会在配置阶段用 Spigot BuildTools
      # 现场生成 spigot-deobf 工件（不随仓库分发，规避 DMCA 风险）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 缓存 Spigot BuildTools 产物（deobf jar + mappings），命中后秒级就绪
      - name: Cache Arclight spigot deps
        id: arclight-cache
        uses: actions/cache@v4
        with:
          path: Arclight/.gradle
          key: arclight-spigotdeps-${{ env.ARCLIGHT_REF }}-v1

      - name: Generate spigot-deobf (BuildTools, skipped when cached)
        working-directory: Arclight
        run: ./gradlew help --no-daemon

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build PaperArc
        working-directory: PaperArc
        run: ./gradlew build --no-daemon

      - name: Collect artifacts
        working-directory: PaperArc
        run: |
          mkdir -p out
          # 三端同名文件会互相覆盖，收集时以加载器为前缀重命名
          for m in fabric neoforge forge; do
            for f in "$m"/build/libs/paperarc-*.jar; do
              case "$f" in *-dev-shadow.jar|*-sources.jar) continue ;; esac
              [ -e "$f" ] || continue
              cp "$f" "out/${m}-$(basename "$f")"
            done
          done
          ls -l out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperArc-build-${{ github.run_number }}
          path: PaperArc/out/*.jar
          if-no-files-found: error
