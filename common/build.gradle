buildscript {
    repositories {
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url = 'https://maven.izzel.io/releases'
        }
        mavenCentral()
    }
    dependencies {
        classpath(group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true)
        classpath(group: 'org.spongepowered', name: 'mixingradle', version: '0.7.2-SNAPSHOT')
    }
}
// paperarc common —— ForgeGradle mod 工程（对齐 Arclight Trials 工具链）
// 源码写 official(mojmap) 名；mixingradle 生成 refmap；reobfJar 阶段自动转 srg 并重映射 refmap

plugins {
    id 'java'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'


repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        url = 'https://maven.izzel.io/releases'
    }
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
    maven {
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url = uri("${rootDir}/../Arclight/.gradle/arclight/arclight_repo")
    }
    flatDir {
        dirs "${rootDir}/vendor/maven-flat"
    }
}

group = rootProject.maven_group
version = rootProject.mod_version

minecraft {
    // official = mojmap，与 Arclight 编译完全一致；reobf 由 ForgeGradle 自动处理
    mappings channel: 'official', version: rootProject.minecraft_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

mixin {
    add sourceSets.main, 'paperarc-common-refmap.json'
}

// Arclight 实现类的编译期桩源码集（见 src/arclightStub 下的类注释）。
// 只进 compileClasspath，不进产物。
sourceSets {
    arclightStub
}

dependencies {
    // 桩里的 bridge 接口签名引用 CraftEntity/CraftWorld（v/ 形态），只需 spigot deobf。
    // 不要把 main 的 compileClasspath 整体加进来：main 的 compileOnly 含本源码集的
    // output，会形成任务环。
    arclightStubCompileOnly "io.izzel.arclight.generated:spigot:${rootProject.minecraft_version}:deobf"

    // Minecraft + Forge（1.20.1-47.4.18）
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // 让 Mixin 注解处理器能验证锚 Arclight 自身类的那几个 mixin 的 @Mixin target
    compileOnly sourceSets.arclightStub.output

    // Bukkit / Arclight 层：运行时由 Arclight 提供
    // 注意：不能同时 compileOnly spigot-api 与 paper-api——两者都含 org.bukkit.event.Event，
    // javac 取 classpath 前者（spigot 无 callEvent()），导致 Paper 扩展方法全部丢失。
    // paper-api 已内嵌完整 spigot-api 类，故只保留 paper-api。
    compileOnly "io.izzel.arclight:arclight-api:${rootProject.arclight_api_version}"

    // Arclight 本地构建产出的 Spigot deobf（含 NMS + CraftBukkit mojang mappings 反混淆）
    // 工件不发布远端，从 Arclight 的 arclight_repo 取；CI 由 workflow 生成
    compileOnly "io.izzel.arclight.generated:spigot:${rootProject.minecraft_version}:deobf"

    // Paper API（实现目标，shade 进最终 jar，排除 org.bukkit —— 运行时用 Arclight 的）
    compileOnly "io.papermc.paper:paper-api:${rootProject.paper_api_version}"

    // MixinExtras + Sponge Mixin（编译 tip）
    compileOnly "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
    compileOnly "org.spongepowered:mixin:${rootProject.mixin_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"
    annotationProcessor "org.spongepowered:mixin:${rootProject.mixin_version}:processor"
}

// ---- 打包：shade paper-api + adventure，MixinExtras 走 Jar-in-Jar，产出单个 mod jar ----
configurations {
    shade
    // Jar-in-Jar（Forge JiJ）嵌套的完整 jar，不解包、不 relocate
    jij
}

dependencies {
    shade("io.papermc.paper:paper-api:${rootProject.paper_api_version}") {
        transitive = false
    }
    shade "net.kyori:adventure-api:${rootProject.adventure_version}"
    shade "net.kyori:adventure-key:${rootProject.adventure_version}"
    shade "net.kyori:adventure-text-minimessage:${rootProject.adventure_version}"
    shade("net.kyori:adventure-text-serializer-gson:${rootProject.adventure_version}") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    shade "net.kyori:adventure-text-serializer-json:${rootProject.adventure_version}"
    shade "net.kyori:adventure-text-serializer-legacy:${rootProject.adventure_version}"
    shade "net.kyori:adventure-text-serializer-plain:${rootProject.adventure_version}"
    // Plugin.getComponentLogger() 的返回类型，运行时必须能解析（slf4j-api 由 Forge 提供，故不传递）
    shade("net.kyori:adventure-text-logger-slf4j:${rootProject.adventure_version}") {
        transitive = false
    }
    shade "net.kyori:examination-api:${rootProject.examination_version}"
    shade "net.kyori:examination-string:${rootProject.examination_version}"
    // MixinExtras 不 shade：未 relocate 的 com.llamalad7 包与其它同样带 MixinExtras 的 mod
    // 会产生模块导出冲突。改为 Forge Jar-in-Jar 原样嵌套（自带 FMLModType=GAMELIBRARY），
    // 由 Forge 的 JarInJar 定位器在多个提供方之间按版本去重。
    jij("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}") {
        transitive = false
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

// 从 paper-api jar 提取 injections.json 中列出的缺失类字节，嵌入 META-INF/paperarc/runtime/
// （不放在 org/bukkit/** 下——模块系统会认为 paperarc 也导出 org.bukkit.entity 包，导致
//  与 arclight 的 ResolutionException；由运行时 RuntimeClassInjector defineClass 注入）
tasks.register('embedRuntimeClasses') {
    def outDir = file("${buildDir}/resources/main/META-INF/paperarc/runtime")
    def configFile = file('src/main/resources/META-INF/paperarc/runtime/injections.json')
    // 注意：不能用 configurations.compileClasspath 在此解析——它含 ForgeGradle 生成的
    // forge-...-mapped_official_at_<hash>.jar，在任务图构建期解析会触发 MinecraftUserRepo
    // 在禁止变更期创建任务（IllegalMutationException），CI 首次构建（无缓存）必失败。
    // 改用 shade（paper-api transitive=false + adventure，纯 Maven 构件）并在 doLast 惰性解析。
    inputs.files(configurations.shade)
    inputs.file(configFile)
    outputs.dir(outDir)
    doLast {
        outDir.mkdirs()
        def paperApi = configurations.shade.files.find { it.name.startsWith('paper-api-') }
        if (paperApi == null) {
            throw new GradleException('paper-api jar not found in shade configuration')
        }
        def config = new groovy.json.JsonSlurper().parseText(configFile.text)
        new java.util.zip.ZipFile(paperApi).withCloseable { zip ->
            config.classes.each { name ->
                def internal = name.replace('.', '/') + '.class'
                def entry = zip.getEntry(internal)
                if (entry == null) {
                    throw new GradleException(internal + ' not found in paper-api jar')
                }
                def out = new File(outDir, internal)
                out.parentFile.mkdirs()
                zip.getInputStream(entry).withCloseable { ins ->
                    out.withOutputStream { os -> ins.transferTo(os) }
                }
            }
        }
    }
}
processResources.dependsOn('embedRuntimeClasses')

// Forge Jar-in-Jar 清单：列出 META-INF/jars/ 下嵌套的 jar 及其版本区间。
// 不用 ForgeGradle 的 jarJar 任务：那会另出一个 classifier=all 的产物，而
// reobfJar→versionCraftBukkit→部署 这条链路是接在 jar 上的，多一个产物就要把整条链
// 复制一遍；手工放入清单与嵌套 jar 只有两行 CopySpec，且最终产物仍然只有一个。
tasks.register('generateJarJarMetadata') {
    def outDir = file("${buildDir}/generated/jarjar/META-INF/jarjar")
    def version = rootProject.mixinextras_version
    inputs.property 'mixinextras_version', version
    outputs.dir outDir
    doLast {
        outDir.mkdirs()
        new File(outDir, 'metadata.json').text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson([
                jars: [[
                    identifier: [group: 'io.github.llamalad7', artifact: 'mixinextras-forge'],
                    version   : [range: "[${version},)".toString(), artifactVersion: version],
                    path      : "META-INF/jars/mixinextras-forge-${version}.jar".toString()
                ]]
            ]))
    }
}

// 打包：shade 依赖（paper-api/adventure）合并进 jar，排除 bukkit 运行时由 Arclight 提供；
// MixinExtras 以嵌套 jar 形式随本 jar 分发（Jar-in-Jar）
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes('MixinConfigs': 'paperarc-common.mixins.json,paperarc-mojmap.mixins.json,paperarc-forge.mixins.json')
    }
    from({
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        // 只排除 shade 依赖自带的嵌套 jar（如 mixinextras-common 的 jarjar 布局）；
        // 这个 exclude 必须限定在 shade 这一段，否则会把下面自己放进去的嵌套 jar 也排掉
        exclude 'META-INF/jars/**'
    }
    // Jar-in-Jar：原样嵌套 mixinextras-forge（含它自己的 META-INF/jars/MixinExtras-x.y.z.jar），
    // 不解包不 relocate；Forge 的 JarInJar 定位器会在多个提供方之间按版本区间去重
    from(configurations.jij) {
        into 'META-INF/jars'
    }
    from(tasks.named('generateJarJarMetadata')) {
        into 'META-INF/jarjar'
    }
    // org.bukkit 接口类由 Arclight 运行时提供（spigot-api），避免模块双导冲突；
    // 接口增补由 bukkit/*IfaceMixin 完成（1.21.1 已验证路径）
    exclude 'org/bukkit/**'
    // io/papermc 与 com/destroystokyo 事件类保留在 mod jar（插件事件引用由本 jar 提供）
    exclude 'org/spigotmc/**'
    exclude 'module-info.class'
    exclude 'META-INF/versions/**'
    // gson 由 Arclight 运行时提供（避免模块系统冲突：paperarc 与 gson 同时导出 com.google.gson.reflect）
    exclude 'com/google/gson/**'
    // MixinExtras 的类只以嵌套 jar 形式提供，不散落进本 jar（否则模块导出冲突）
    exclude 'com/llamalad7/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 把 deobf 的 v/ 版本无关包重写回当前版本号（v1_20_R1），对齐 Arclight 的
// wipeVersion/reobfVersion 机制：Arclight 源码用 org.bukkit.craftbukkit.v 编译，
// 产物阶段由 arclight-gradle-plugin 把 v/ 重写回 v1_20_R1；paperarc 源码同样引用
// v/（跨 MC 版本可复用），因此产物必须在打包后做相同重写，运行时才能匹配
// Arclight 提供的 v1_20_R1 Craft* 类。
import com.ixnah.mc.paperarc.build.MarkSyntheticStaticApiTask
import com.ixnah.mc.paperarc.build.VersionCraftBukkitTask

// Mixin 0.8.5 不许把非 private 的静态方法合并进目标类，唯一放行口是 ACC_SYNTHETIC
// （见 MarkSyntheticStaticApiTask 的注释）。@Mixin(Bukkit.class) 的静态门面靠这一步成立。
tasks.register('markSyntheticStaticApi', MarkSyntheticStaticApiTask) {
    dependsOn tasks.named('compileJava')
    classesDir.set(layout.buildDirectory.dir('classes/java/main'))
    outputs.upToDateWhen { false }   // 就地改 compileJava 的输出，幂等，不参与增量
}

tasks.named('jar') {
    dependsOn 'markSyntheticStaticApi'
}

tasks.register('versionCraftBukkit', VersionCraftBukkitTask) {
    dependsOn tasks.named('jar')
    jar.set(file("${buildDir}/libs/${project.name}-${project.version}.jar"))
    revision.set('v1_20_R1')
    mixinConfigs.set('paperarc-common.mixins.json,paperarc-mojmap.mixins.json,paperarc-forge.mixins.json')
}

// 产物重写必须在 jar 之后生效于最终产物（assemble/build 产出 jar）
tasks.named('assemble') {
    dependsOn 'versionCraftBukkit'
}


// mixin 注册一致性检查：mixin/** 下每个带 @Mixin 的类都必须出现在某个
// paperarc-*.mixins.json，反之 json 里的条目必须有对应源码，且 mixin 包内不得
// 存在非 mixin 辅助类（会被目标类引用时触发 IllegalClassLoadError，run34 实测）。
// 与 tools/scripts/check-mixin-registry.py 同规则；此处内联实现以便 CI 的
// `./gradlew build` 无需外部脚本即可门禁（main 分支 Server/Player/LivingEntity
// 六个实现 mixin 漏注册的 P0 缺陷就是这条规则漏掉的）。
tasks.register('checkMixinRegistry') {
    def resourcesDir = file('src/main/resources')
    def javaDir = file('src/main/java')
    inputs.dir(javaDir)
    inputs.files(fileTree(resourcesDir) { include 'paperarc-*.mixins.json' })
    outputs.upToDateWhen { false }
    doLast {
        def problems = []
        resourcesDir.listFiles()?.findAll {
            it.name.startsWith('paperarc-') && it.name.endsWith('.mixins.json')
        }?.sort { it.name }?.each { cfgFile ->
            def cfg = new groovy.json.JsonSlurper().parse(cfgFile)
            if (!cfg.package) {
                return
            }
            def listed = []
            ['mixins', 'client', 'server'].each { key -> if (cfg[key]) listed.addAll(cfg[key]) }
            def pkgDir = new File(javaDir, cfg.package.replace('.', '/'))
            def found = [:]
            if (pkgDir.isDirectory()) {
                pkgDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    if (!f.name.endsWith('.java')) {
                        return
                    }
                    def rel = pkgDir.toPath().relativize(f.toPath()).toString()
                    def name = rel[0..-6].replace(File.separator, '.')
                    found[name] = f.text =~ /(?m)^\s*@Mixin\b/
                }
            }
            found.sort().each { name, isMixin ->
                if (isMixin && !listed.contains(name)) {
                    problems << "${cfgFile.name}: UNREGISTERED ${name}"
                } else if (!isMixin) {
                    problems << "${cfgFile.name}: NON_MIXIN ${name}（mixin 包内不得有非 mixin 类，请移到 bridge/）"
                }
            }
            listed.toSorted().each { name ->
                if (!found.containsKey(name)) {
                    problems << "${cfgFile.name}: MISSING ${name}"
                }
            }
            listed.countBy { it }.findAll { it.value > 1 }.each { name, n ->
                problems << "${cfgFile.name}: DUPLICATE ${name}"
            }
        }
        if (problems) {
            throw new GradleException("mixin 注册不一致:\n  " + problems.join('\n  '))
        }
        logger.lifecycle('checkMixinRegistry: OK')
    }
}

// IfaceMixin 声明 <-> ApiMixin 实现 两侧配套核对（A4-1，与 main 的 checkIfaceImplPairing 同源）。
// 规则见 tools/scripts/check-iface-impl-pairing.py：
//   NO_DECL   —— 有实现体但接口上没声明，插件经接口调用即 NoSuchMethodError；
//   NO_IMPL   —— 有声明但任何运行时实现类都没有实现体，调用即 AbstractMethodError；
//   PARTIAL_IMPL —— 同一接口多个互不继承的实现类只覆盖了一个，走到另一个同样 AbstractMethodError。
// 判定需要运行时 jar（Arclight / spigot-deobf / paper-api / adventure），这些都在仓库之外，
// 所以脚本或 jar 不可用时只警告不失败（CI 里退化为 no-op）。
// 两个门禁共用的 jar 定位（都在仓库之外，缺失时门禁降级为跳过）
ext.paperarcAuditJars = { File ws ->
    def runtime = [
        new File(ws, 'Arclight/testserver-forge/.arclight/mod_file').listFiles()
            ?.find { it.name.startsWith('arclight-1.20.1-') && it.name.endsWith('.jar') },
        new File(ws, 'Arclight/.gradle/arclight/arclight_repo/io/izzel/arclight/generated/spigot/1.20.1/spigot-1.20.1-deobf.jar'),
    ]
    // paper-api / adventure 只用来解析 IfaceMixin 的 `extends 父接口`，不能混进运行时索引
    def api = [
        fileTree(new File(System.getProperty('user.home'),
            '.gradle/caches/modules-2/files-2.1/io.papermc.paper/paper-api/1.20.1-R0.1-SNAPSHOT')) {
            include '**/paper-api-1.20.1-R0.1-SNAPSHOT.jar'
        }.files.find { true },
        fileTree(new File(System.getProperty('user.home'),
            ".gradle/caches/modules-2/files-2.1/net.kyori/adventure-api/${rootProject.adventure_version}")) {
            include "**/adventure-api-${rootProject.adventure_version}.jar"
        }.files.find { true },
    ]
    if ((runtime + api).any { it == null || !it.isFile() }) {
        return null
    }
    [runtime: runtime, api: api]
}

tasks.register('checkIfaceImplPairing') {
    def script = rootProject.file('../tools/scripts/check-iface-impl-pairing.py')
    def repoRoot = rootProject.projectDir
    def ws = rootProject.file('..')
    def baseline = rootProject.file('gradle/iface-impl-pairing-baseline.txt')
    inputs.dir(file('src/main/java'))
    inputs.file(baseline).optional()
    outputs.upToDateWhen { false }
    doLast {
        if (!script.isFile()) {
            logger.warn("checkIfaceImplPairing: 找不到 ${script}，跳过")
            return
        }
        def jars = paperarcAuditJars(ws)
        if (jars == null) {
            logger.warn('checkIfaceImplPairing: 运行时/API jar 不可用，跳过')
            return
        }
        def cmd = ['python3', script.absolutePath, repoRoot.absolutePath, '--jars']
        cmd.addAll(jars.runtime*.absolutePath)
        cmd << '--api-jars'
        cmd.addAll(jars.api*.absolutePath)
        cmd << '--baseline' << baseline.absolutePath
        def out = new ByteArrayOutputStream()
        def result = project.exec {
            commandLine cmd
            ignoreExitValue = true
            standardOutput = out
            errorOutput = out
        }
        def text = out.toString()
        if (result.exitValue == 2) {
            logger.warn("checkIfaceImplPairing: 运行时 jar 不可用，跳过\n${text}")
        } else if (result.exitValue != 0) {
            throw new GradleException("IfaceMixin 声明与实现不配套:\n${text}")
        } else {
            logger.lifecycle("checkIfaceImplPairing: ${text.trim()}")
        }
    }
}

// 实现体调用的 org.bukkit API 在运行时是否真的存在（checklist §1.6 n，A4-1）。
// 我们编译针对 paper-api，运行时只有 spigot-api + Arclight 的补丁：
// Material#isEmpty()、Location#x()/y()/z()、LecternInventory#getBook() 这类
// paper 自加的便利/default 方法调了就是 NoSuchMethodError，且只有真的走到那行才暴露。
tasks.register('checkRuntimeApiCalls') {
    dependsOn 'compileJava'
    def script = rootProject.file('../tools/scripts/check-runtime-api-calls.py')
    def repoRoot = rootProject.projectDir
    def ws = rootProject.file('..')
    def classesDir = layout.buildDirectory.dir('classes/java/main')
    outputs.upToDateWhen { false }
    doLast {
        if (!script.isFile()) {
            logger.warn("checkRuntimeApiCalls: 找不到 ${script}，跳过")
            return
        }
        def jars = paperarcAuditJars(ws)
        if (jars == null) {
            logger.warn('checkRuntimeApiCalls: 运行时/API jar 不可用，跳过')
            return
        }
        def cmd = ['python3', script.absolutePath, classesDir.get().asFile.absolutePath,
                   repoRoot.absolutePath, '--jars']
        cmd.addAll(jars.runtime*.absolutePath)
        cmd << '--api-jars'
        cmd.addAll(jars.api*.absolutePath)
        def out = new ByteArrayOutputStream()
        def result = project.exec {
            commandLine cmd
            ignoreExitValue = true
            standardOutput = out
            errorOutput = out
        }
        def text = out.toString()
        if (result.exitValue == 2) {
            logger.warn("checkRuntimeApiCalls: 运行时 jar 不可用，跳过\n${text}")
        } else if (result.exitValue != 0) {
            throw new GradleException("实现体调了运行时不存在的 org.bukkit API:\n${text}")
        } else {
            logger.lifecycle("checkRuntimeApiCalls: ${text.trim()}")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkMixinRegistry'
    dependsOn 'checkIfaceImplPairing'
    dependsOn 'checkRuntimeApiCalls'
}
