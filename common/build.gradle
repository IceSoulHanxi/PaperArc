architectury {
    common(rootProject.enabled_platforms.split(','))
}

loom {
    // Access Widener：以 AW 而非反射解决 NMS 成员访问问题（Fox 私有状态、TextDisplay 文本字段等）
    accessWidenerPath = file('src/main/resources/paperarc.accesswidener')
}

dependencies {
    // Bukkit / Arclight 层：运行时由 Arclight 提供，仅编译期可见
    compileOnly libs.spigot.api
    compileOnly libs.arclight.api

    // Arclight 本地构建产出的 Spigot（NMS + CraftBukkit，mojang mappings 反混淆版）。
    // 工件不发布远端，只能从 Arclight 仓库的本地 arclight_repo 拿；
    // 用于后续 mixin 中引用 Craft* 类与 NMS 精确签名。
    // 条件启用：Arclight 构建完成后该目录出现工件即自动生效。
    if (file("${rootDir}/../Arclight/.gradle/arclight/arclight_repo/io/izzel/arclight/generated/spigot/1.20.1").isDirectory()
            || file("${rootDir}/vendor/maven-flat/spigot-1.20.1-deobf.jar").isFile()) {
        compileOnly 'io.izzel.arclight.generated:spigot:1.20.1:deobf'
    }

    // Paper API 表面（实现目标）；shade 由各平台子项目负责
    compileOnly libs.paper.api

    // MixinExtras 注解（common mixin 可用 @WrapOperation 等）
    compileOnly libs.mixinextras.common
    annotationProcessor libs.mixinextras.common

    // Sponge Mixin 注解：@Mixin/@Inject/@Slice 等编译期需要（运行时 Forge/Arclight 自带）
    compileOnly libs.mixin

    // ASM（mixin 注解处理器与 FIELD 注入的 Opcodes 编译期需要）
    compileOnly 'org.ow2.asm:asm:9.6'
}
