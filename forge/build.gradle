plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        convertAccessWideners = true
        mixinConfig 'paperarc-common.mixins.json'
        mixinConfig 'paperarc-mojmap.mixins.json'
        mixinConfig 'paperarc-forge.mixins.json'
    }
}

configurations {
    common
    shadowCommon // 不要用 shadow 插件自带的 shadow 配置，它会 exclude 文件
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge libs.forge

    compileOnly libs.spigot.api
    compileOnly libs.paper.api

    // MixinExtras：Forge 不自带，通过 loom include 嵌套 jar（remapJar 自动写 mods.toml [[files]]）
    implementation libs.mixinextras.forge
    annotationProcessor libs.mixinextras.forge
    include libs.mixinextras.forge

    // shade paper-api + adventure（shadowJar 中排除 org.bukkit，运行时用 Arclight 的）
    shadowCommon(libs.paper.api) { transitive = false }
    shadowCommon(libs.bundles.adventure) { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    exclude 'org/bukkit/**'
    // arclight 自身导出 org.spigotmc，避免分包冲突
    exclude 'org/spigotmc/**'
    exclude 'module-info.class'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// CraftBukkit 包版本化：deobf v/ -> 运行时 v1_20_R1（含 mixin refmap）
tasks.register('versionCraftBukkit', com.ixnah.mc.paperarc.build.VersionCraftBukkitTask) {
    jar.set(tasks.named('remapJar').flatMap { it.archiveFile })
    revision.set('v1_20_R1')
    mixinConfigs.set('paperarc-common.mixins.json,paperarc-mojmap.mixins.json,paperarc-forge.mixins.json')
}
tasks.matching { it.name == 'versionCraftBukkit' }.configureEach {
    mustRunAfter tasks.named('remapJar')
    outputs.upToDateWhen { false }
}
tasks.named('build') {
    dependsOn 'versionCraftBukkit'
}
