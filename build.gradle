plugins {
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'com.gradleup.shadow' version '8.3.+' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

// 门禁脚本所在的 PaperArc/tools：主树 PaperArc/paperarc 下是 ../tools，
// worktree PaperArc/worktrees/<slug> 下是 ../../tools；也可用 -PpaperarcTools=<dir> 指定。
ext.paperarcToolsDir = [findProperty('paperarcTools'), '../tools', '../../tools']
        .findAll { it != null }
        .collect { rootProject.file(it) }
        .find { new File(it, 'scripts').isDirectory() } ?: rootProject.file('../tools')

// 门禁比对用的运行时 jar：spigot-deobf + Arclight 运行时 mod jar（带 org.bukkit.*）。
// mod jar 依次取 -ParclightModJar=<jar>、GoS run_prod 解包出的 mod_file、GoS 本地构建的
// fabric mod jar；任一侧缺失返回空表，门禁只警告跳过。不回落到 1.21.1 的 jar（口径会错）。
// deobf 必须排在前面：脚本按"先见到的同名类为准"，而未解包的 mod jar 里 CraftBukkit 还在
// craftbukkit/v 包下、NMS 是 intermediary 名，排前面会遮住 deobf 里 mojmap 描述符的同名类。
ext.paperarcRuntimeJars = { ->
    def modJars = []
    def explicit = findProperty('arclightModJar')
    if (explicit != null) {
        modJars = [rootProject.file(explicit)].findAll { it.isFile() }
    }
    def modFileDir = rootProject.file('../arclight-gos/bootstrap/run_prod/fabric/.arclight/mod_file')
    if (modJars.isEmpty() && modFileDir.isDirectory()) {
        modJars = modFileDir.listFiles().findAll { it.name.startsWith('arclight-') && it.name.endsWith('.jar') }
    }
    def libsDir = rootProject.file('../arclight-gos/arclight-fabric/build/libs')
    if (modJars.isEmpty() && libsDir.isDirectory()) {
        modJars = libsDir.listFiles().findAll { it.name ==~ /arclight-fabric-[0-9.]+(-SNAPSHOT)?\.jar/ }
    }
    def spigotDeobf = [
            rootProject.file('vendor/maven-flat/spigot-1.21.11-deobf.jar'),
            rootProject.file('../arclight-gos/.gradle/arclight/arclight_repo/io/izzel/arclight/generated/spigot/1.21.11/spigot-1.21.11-deobf.jar')
    ].find { it.isFile() }
    return (modJars.isEmpty() || spigotDeobf == null) ? [] : [spigotDeobf] + modJars
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'maven-publish'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    repositories {
        // CI/离线：Arclight spigot-deobf 工件的本地落点（由 workflow 预先下载）
        flatDir { dirs "${rootDir}/vendor/maven-flat" }
        mavenCentral()
        // Bukkit / Spigot API 快照仓库
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
        // arclight-api 所在仓库
        maven { url = 'https://maven.izzel.io/releases' }
        // Paper API 仓库
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        // Architectury 运行库
        maven { url = 'https://maven.architectury.dev/' }
        // NeoForge 官方仓库
        maven { url = 'https://maven.neoforged.net/releases' }
        // Arclight 本地构建产出（io.izzel.arclight.generated:spigot 等），不发布远端
        maven { url = uri("${rootDir}/../Arclight/.gradle/arclight/arclight_repo") }
        maven { url = uri("${rootDir}/../arclight-gos/.gradle/arclight/arclight_repo") }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    configurations.configureEach {
        resolutionStrategy.capabilitiesResolution.withCapability("org.spigotmc:spigot-api") {
            select("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    // mixin 注册一致性检查：mixin/** 下每个带 @Mixin 的类都必须出现在本模块某个
    // paperarc-*.mixins.json，反之 json 里的条目必须有对应源码，且 mixin 包内不得
    // 存在非 mixin 辅助类（会被目标类引用时触发 IllegalClassLoadError）。
    // 与 tools/scripts/check-mixin-registry.py 同规则；内联实现以便 CI 的
    // `./gradlew build` 无需外部脚本即可门禁——Server/Player/LivingEntity 六个实现
    // mixin 从未注册的 P0 缺陷就是漏了这条规则。
    tasks.register('checkMixinRegistry') {
        def resourcesDir = file('src/main/resources')
        def javaDir = file('src/main/java')
        inputs.dir(javaDir).optional()
        inputs.files(fileTree(resourcesDir) { include 'paperarc-*.mixins.json' })
        outputs.upToDateWhen { false }
        doLast {
            def problems = []
            resourcesDir.listFiles()?.findAll {
                it.name.startsWith('paperarc-') && it.name.endsWith('.mixins.json')
            }?.sort { it.name }?.each { cfgFile ->
                def cfg = new groovy.json.JsonSlurper().parse(cfgFile)
                if (!cfg.package) {
                    return
                }
                def listed = []
                ['mixins', 'client', 'server'].each { key -> if (cfg[key]) listed.addAll(cfg[key]) }
                def pkgDir = new File(javaDir, cfg.package.replace('.', '/'))
                def found = [:]
                if (pkgDir.isDirectory()) {
                    pkgDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                        if (!f.name.endsWith('.java')) {
                            return
                        }
                        def rel = pkgDir.toPath().relativize(f.toPath()).toString()
                        def name = rel[0..-6].replace(File.separator, '.')
                        found[name] = f.text =~ /(?m)^\s*@Mixin\b/
                    }
                }
                found.sort().each { name, isMixin ->
                    if (isMixin && !listed.contains(name)) {
                        problems << "${cfgFile.name}: UNREGISTERED ${name}"
                    } else if (!isMixin) {
                        problems << "${cfgFile.name}: NON_MIXIN ${name}（mixin 包内不得有非 mixin 类，请移到 bridge/）"
                    }
                }
                listed.toSorted().each { name ->
                    if (!found.containsKey(name)) {
                        problems << "${cfgFile.name}: MISSING ${name}"
                    }
                }
                listed.countBy { it }.findAll { it.value > 1 }.each { name, n ->
                    problems << "${cfgFile.name}: DUPLICATE ${name}"
                }
            }
            if (problems) {
                throw new GradleException("mixin 注册不一致:\n  " + problems.join('\n  '))
            }
            logger.lifecycle("checkMixinRegistry(${project.name}): OK")
        }
    }

    // IfaceMixin 声明 <-> ApiMixin 实现 两侧配套核对（B2-1c）。
    // 规则见 tools/scripts/check-iface-impl-pairing.py：
    //   NO_DECL —— 有实现体但接口上没声明，插件经接口调用即 NoSuchMethodError；
    //   NO_IMPL —— 有声明但任何运行时实现类都没有实现体，调用即 AbstractMethodError。
    // 判定需要运行时 jar（Arclight / spigot-deobf / paper-api），这些都在仓库之外，
    // 所以脚本或 jar 不可用时只警告不失败（CI 里退化为 no-op）。
    if (project.name == 'common') {
        tasks.register('checkIfaceImplPairing') {
            def script = new File(rootProject.paperarcToolsDir, 'scripts/check-iface-impl-pairing.py')
            def repoRoot = rootProject.projectDir
            inputs.dir(file('src/main/java')).optional()
            outputs.upToDateWhen { false }
            doLast {
                if (!script.isFile()) {
                    logger.warn("checkIfaceImplPairing: 找不到 ${script}，跳过")
                    return
                }
                def runtimeJars = rootProject.paperarcRuntimeJars()
                if (runtimeJars.isEmpty()) {
                    logger.warn("checkIfaceImplPairing: 运行时 jar 不可用，跳过")
                    return
                }
                def apiJars = project.configurations.compileClasspath.files.findAll {
                    it.name.startsWith('paper-api-') || it.name.startsWith('adventure-api-')
                }
                def cmd = ['python3', script.absolutePath, repoRoot.absolutePath, '--jars']
                cmd.addAll(runtimeJars.collect { it.absolutePath })
                cmd << '--api-jars'
                cmd.addAll(apiJars.collect { it.absolutePath })
                def out = new ByteArrayOutputStream()
                def result = project.exec {
                    commandLine cmd
                    ignoreExitValue = true
                    standardOutput = out
                    errorOutput = out
                }
                def text = out.toString()
                if (result.exitValue == 2) {
                    logger.warn("checkIfaceImplPairing: 运行时 jar 不可用，跳过\n${text}")
                } else if (result.exitValue != 0) {
                    throw new GradleException("IfaceMixin 声明与实现不配套:\n${text}")
                } else {
                    logger.lifecycle("checkIfaceImplPairing: ${text.trim()}")
                }
            }
        }
    }

    // B4/X-2：Mixin 的 MixinApplicatorStandard.checkMethodVisibility 直接拒绝把
    // **非 private 的 static 方法**合并进目标类，而且是运行时 APPLY 阶段才炸
    // （InvalidMixinException: contains non-private static method），编译期与
    // refmap 都发现不了。给 org.bukkit.Bukkit / ItemStack 补 paper 的 static 门面
    // 方法时真机踩过一次，立门禁。
    tasks.register('checkMixinStaticMethods') {
        def script = new File(rootProject.paperarcToolsDir, 'scripts/check-mixin-static-methods.py')
        def srcDir = file('src/main/java')
        inputs.dir(srcDir).optional()
        outputs.upToDateWhen { false }
        doLast {
            if (!script.isFile() || !srcDir.isDirectory()) {
                logger.warn("checkMixinStaticMethods: 找不到 ${script} 或源码目录，跳过")
                return
            }
            def out = new ByteArrayOutputStream()
            def result = project.exec {
                commandLine 'python3', script.absolutePath, srcDir.absolutePath
                ignoreExitValue = true
                standardOutput = out
                errorOutput = out
            }
            def text = out.toString()
            if (result.exitValue != 0) {
                throw new GradleException("mixin 里有非 private 的 static 方法:\n${text}")
            }
            logger.lifecycle("${text.trim()}")
        }
    }

    // B2-3：require = 0 会把"注入一个都没命中"变成静默降级，1.20.1 与 main 加起来
    // 已经藏了 5 个从未生效的注入。全仓清零后立门禁：新写的注入不许再用 require = 0，
    // 确实锚不住的要像 ThrownEggHatch / EntityTeleportEndGateway 那样删掉并记 docs/gaps.md。
    tasks.register('checkNoSilentInjections') {
        def javaDir = file('src/main/java')
        inputs.dir(javaDir).optional()
        outputs.upToDateWhen { false }
        doLast {
            if (!javaDir.isDirectory()) {
                return
            }
            def hits = []
            javaDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!f.name.endsWith('.java')) {
                    return
                }
                f.eachLine { line, n ->
                    // 只看代码行，注释里提到 require = 0 是允许的
                    def code = line.replaceAll('//.*$', '')
                    if (code.trim().startsWith('*')) {
                        return
                    }
                    if (code =~ /require\s*=\s*0\b/) {
                        hits << "${f.name}:${n}: ${line.trim()}"
                    }
                }
            }
            if (hits) {
                throw new GradleException("注入不许用 require = 0（静默降级）:\n  " + hits.join('\n  '))
            }
            logger.lifecycle("checkNoSilentInjections(${project.name}): OK")
        }
    }

    // 实现体调用的 org.bukkit API 在运行时是否真的存在（Phase A4 立的门禁，两分支通用）。
    // 直接读编译产物的常量池比对运行时 jar，不用起服务器就能抓 checklist §1.6 n 那一类
    // ——「编译期有（我们针对 paper-api 编译）、运行时没有」的调用点，例如
    // ItemStack#isEmpty()/Location#x()。判定同样要仓库外的运行时 jar，取不到就只警告。
    tasks.register('checkRuntimeApiCalls') {
        def script = new File(rootProject.paperarcToolsDir, 'scripts/check-runtime-api-calls.py')
        def repoRoot = rootProject.projectDir
        def classesDir = file("${buildDir}/classes/java/main")
        dependsOn tasks.named('classes')
        outputs.upToDateWhen { false }
        doLast {
            def runtimeJars = rootProject.paperarcRuntimeJars()
            if (!script.isFile() || runtimeJars.isEmpty() || !classesDir.isDirectory()) {
                logger.warn("checkRuntimeApiCalls(${project.name}): 脚本或运行时 jar 不可用，跳过")
                return
            }
            def apiJars = project.configurations.compileClasspath.files.findAll {
                it.name.startsWith('paper-api-') || it.name.startsWith('adventure-api-')
            }
            def cmd = ['python3', script.absolutePath, classesDir.absolutePath, repoRoot.absolutePath, '--jars']
            cmd.addAll(runtimeJars.collect { it.absolutePath })
            if (!apiJars.isEmpty()) {
                cmd.add('--api-jars')
                cmd.addAll(apiJars.collect { it.absolutePath })
            }
            def out = new ByteArrayOutputStream()
            def result = project.exec {
                commandLine cmd
                ignoreExitValue = true
                standardOutput = out
                errorOutput = out
            }
            def text = out.toString()
            if (result.exitValue == 2) {
                logger.warn("checkRuntimeApiCalls(${project.name}): 运行时 jar 不可用，跳过\n${text}")
            } else if (result.exitValue != 0) {
                throw new GradleException("实现体调用了运行时不存在的 org.bukkit API:\n${text}")
            } else {
                logger.lifecycle("checkRuntimeApiCalls(${project.name}): ${text.trim()}")
            }
        }
    }

    // A6/B6-1：上面两个门禁都按"名字 + 形参个数"匹配，照不到"同名、同形参个数、类型不同"，
    // 也照不到"Bukkit 静态门面转发到一个运行时根本不存在的 Server 重载"。两种模式都按
    // **完整描述符**：--decls 声明必须在 paper-api 上真的存在；--calls 调用点必须在运行时
    // （或我们自己的 mixin / @Widen 成员）上真的存在。故意提前实现的下版本方法放基线文件。
    tasks.register('checkApiDescriptors') {
        def script = new File(rootProject.paperarcToolsDir, 'scripts/check-api-descriptors.py')
        def baseline = rootProject.file('gradle/api-descriptor-baseline.txt')
        def classesDir = file("${buildDir}/classes/java/main")
        dependsOn tasks.named('classes')
        inputs.file(baseline).optional()
        outputs.upToDateWhen { false }
        doLast {
            def runtimeJars = rootProject.paperarcRuntimeJars()
            if (!script.isFile() || runtimeJars.isEmpty() || !classesDir.isDirectory()) {
                logger.warn("checkApiDescriptors(${project.name}): 脚本或运行时 jar 不可用，跳过")
                return
            }
            def apiJars = project.configurations.compileClasspath.files.findAll {
                it.name.startsWith('paper-api-') || it.name.startsWith('adventure-api-')
            }
            if (apiJars.isEmpty()) {
                logger.warn("checkApiDescriptors(${project.name}): paper-api 不在 compileClasspath，跳过")
                return
            }
            def cmd = ['python3', script.absolutePath, classesDir.absolutePath, '--jars']
            cmd.addAll(runtimeJars.collect { it.absolutePath })
            cmd << '--api-jars'
            cmd.addAll(apiJars.collect { it.absolutePath })
            cmd << '--baseline' << baseline.absolutePath
            def out = new ByteArrayOutputStream()
            def result = project.exec {
                commandLine cmd
                ignoreExitValue = true
                standardOutput = out
                errorOutput = out
            }
            def text = out.toString()
            if (result.exitValue == 2) {
                logger.warn("checkApiDescriptors(${project.name}): 运行时 jar 不可用，跳过\n${text}")
            } else if (result.exitValue != 0) {
                throw new GradleException("API 完整描述符对不上:\n${text}")
            } else {
                logger.lifecycle("checkApiDescriptors(${project.name}): ${text.trim()}")
            }
        }
    }

    tasks.named('check') {
        dependsOn 'checkMixinRegistry'
        dependsOn 'checkNoSilentInjections'
        dependsOn 'checkRuntimeApiCalls'
        dependsOn 'checkMixinStaticMethods'
        dependsOn 'checkApiDescriptors'
        if (project.name == 'common') {
            dependsOn 'checkIfaceImplPairing'
            dependsOn rootProject.tasks.named('checkLoaderMixinParity')
        }
    }

    // AccessWidener -> Forge/NeoForge AccessTransformer。
    // loom 的 `convertAccessWideners = true` 只作用于**开发期**运行时，产物 jar 里不会有
    // META-INF/accesstransformer.cfg；而 fabric.mod.json 的 "accessWidener" 只有 Fabric 认。
    // 结果是 paperarc.accesswidener 里的每一条在 Forge/NeoForge 生产服上都没生效，
    // 一访问被放开的 NMS 成员就 IllegalAccessError（B4 在 CompoundTag.tags 上实测）。
    // 这里从同一份 AW 生成 AT，保证三端访问权限一致、单一事实来源。
    if (project.name == 'neoforge') {
        def awFile = rootProject.file('common/src/main/resources/paperarc.accesswidener')
        def atDir = layout.buildDirectory.dir('generated/accesstransformer')
        def genAt = tasks.register('generateAccessTransformer') {
            inputs.file(awFile)
            outputs.dir(atDir)
            doLast {
                def out = ['# 由 generateAccessTransformer 从 common/src/main/resources/paperarc.accesswidener 生成，勿手改。']
                // 同一个成员可能同时有 accessible 与 mutable 两条 AW（前者给 public、后者去 final），
                // 合并成一条 AT：public-f 覆盖 public，避免 ModLauncher 拿到重复条目。
                def seen = [:]
                def emit = { String verb, String target ->
                    if (seen[target] != 'public-f') {
                        seen[target] = verb
                    }
                }
                awFile.eachLine { raw ->
                    def line = raw.replaceAll('#.*$', '').trim()
                    if (!line || line.startsWith('accessWidener')) {
                        return
                    }
                    def p = line.split('\\s+')
                    def access = p[0]
                    def kind = p[1]
                    def owner = p[2].replace('/', '.')
                    if (access != 'accessible' && access != 'mutable') {
                        throw new GradleException("unsupported access widener verb '${access}': ${line}")
                    }
                    // accessible -> public；mutable -> 去掉 final
                    def at = access == 'mutable' ? 'public-f' : 'public'
                    switch (kind) {
                        case 'class':  emit(at, owner); break
                        case 'field':  emit(at, "${owner} ${p[3]}"); break
                        case 'method': emit(at, "${owner} ${p[3]}${p[4]}"); break
                        default: throw new GradleException("unsupported access widener target '${kind}': ${line}")
                    }
                }
                seen.each { target, verb -> out << "${verb} ${target}" }
                def f = atDir.get().file('META-INF/accesstransformer.cfg').asFile
                f.parentFile.mkdirs()
                f.text = out.join('\n') + '\n'
                logger.lifecycle("generateAccessTransformer(${project.name}): ${out.size() - 1} entries")
            }
        }
        tasks.named('processResources') {
            dependsOn genAt
            from(atDir)
        }
    }
}

// paperarc-mojmap.mixins.json（Forge/NeoForge）与 paperarc-fabric.mixins.json（Fabric）
// 是同一批注入点的两套锚法，必须一一对应。漏一个 = 那个注入只在两个加载器上生效，
// 而启动门禁完全看不出来（B6 里 21 个 FieldsMixin 在 Fabric 上整批失效就是这么来的）。
tasks.register('checkLoaderMixinParity') {
    def mojmap = file('common/src/main/resources/paperarc-mojmap.mixins.json')
    def fabric = file('fabric/src/main/resources/paperarc-fabric.mixins.json')
    inputs.files(mojmap, fabric)
    outputs.upToDateWhen { false }
    doLast {
        def names = { File f ->
            def cfg = new groovy.json.JsonSlurper().parse(f)
            def out = []
            ['mixins', 'client', 'server'].each { k -> if (cfg[k]) out.addAll(cfg[k]) }
            out.toSet()
        }
        def m = names(mojmap)
        def fa = names(fabric)
        def onlyMojmap = (m - fa).sort()
        def onlyFabric = (fa - m).sort()
        if (onlyMojmap || onlyFabric) {
            throw new GradleException("mojmap / fabric 两套 mixin 配置不对称:\n" +
                    "  只在 mojmap: ${onlyMojmap}\n  只在 fabric: ${onlyFabric}")
        }
        logger.lifecycle("checkLoaderMixinParity: OK (${m.size()} 对)")
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'

    group = rootProject.maven_group
    version = rootProject.mod_version

    base {
        archivesName = rootProject.archives_base_name
    }
}
