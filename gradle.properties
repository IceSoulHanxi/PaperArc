# 依赖版本
spigot_api_version=1.20.1-R0.1-SNAPSHOT
arclight_api_version=1.5.4
paper_api_version=1.20.1-R0.1-SNAPSHOT
adventure_version=4.14.0
examination_version=1.3.0
mixinextras_version=0.4.1
mixin_version=0.8.7

# 项目坐标
archives_base_name=paperarc
mod_version=0.1.0-SNAPSHOT
maven_group=com.ixnah.mc.paperarc