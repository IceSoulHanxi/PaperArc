# JVM 参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ForgeGradle 5.1 需要 Gradle 7.x（wrapper 已固定 7.6.1）
# Minecraft 版本
minecraft_version=1.20.1
forge_version=47.4.18

# 目标加载器平台（1.20.1 跟随 Arclight Trials：仅 Forge）
