plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api

    compileOnly libs.spigot.api
    compileOnly libs.paper.api
    // deobf spigot：CB 类引用（CraftBlock 等）编译需要，运行时由 versionCraftBukkit 版本化
    compileOnly "io.izzel.arclight.generated:spigot:1.21.1:deobf"

    // MixinExtras：loom include 自动嵌套 jar 并引导初始化
    implementation libs.mixinextras.fabric
    annotationProcessor libs.mixinextras.fabric
    include libs.mixinextras.fabric

    // shade paper-api + adventure（shadowJar 中排除 org.bukkit，运行时用 Arclight 的）
    shadowCommon(libs.paper.api) { transitive = false }
    shadowCommon(libs.bundles.adventure) { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'architectury.common.json'
    exclude 'org/bukkit/**'
    exclude 'module-info.class'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// CraftBukkit 包版本化：deobf v/ -> 运行时 v1_21_R1（含 mixin refmap）
tasks.register('versionCraftBukkit', dev.paperarc.build.VersionCraftBukkitTask) {
    jar.set(remapJar.archiveFile)
    revision.set('v1_21_R1')
    mixinConfigs.set('')
}
tasks.matching { it.name == 'versionCraftBukkit' }.configureEach {
    mustRunAfter remapJar
    outputs.upToDateWhen { false }
}
tasks.named('build') {
    dependsOn 'versionCraftBukkit'
}
