plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api

    compileOnly libs.spigot.api
    compileOnly libs.paper.api
    // deobf spigot：CB 类引用（CraftBlock 等）编译需要，运行时由 versionCraftBukkit 版本化
    def arclightSpigotDeobf = file("${rootDir}/../Arclight/.gradle/arclight/arclight_repo/io/izzel/arclight/generated/spigot/1.21.1").isDirectory()
            || file("${rootDir}/vendor/maven-flat/spigot-1.21.1-deobf.jar").isFile()
    if (arclightSpigotDeobf) {
        compileOnly "io.izzel.arclight.generated:spigot:1.21.1:deobf"
    }

    // MixinExtras：loom include 自动嵌套 jar 并引导初始化
    implementation libs.mixinextras.fabric
    annotationProcessor libs.mixinextras.fabric
    include libs.mixinextras.fabric

    // shade paper-api + adventure（shadowJar 中排除 org.bukkit，运行时用 Arclight 的）
    shadowCommon(libs.paper.api) { transitive = false }
    shadowCommon(libs.bundles.adventure) { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Fabric 侧的运行时缺失类型：Knot 没有 ModLauncher 的 ITransformerLoader，
// RuntimeClassInjector 的 phase1 hook 挂不上（mixin 解析描述符类型时走的是字节码，
// defineClass 出来的类没有 .class 资源 → ClassMetadataNotFoundException）。
// Fabric 也没有 JPMS 模块层，不存在"paperarc 与 arclight 同时导出 org.bukkit.*"的
// ResolutionException（那是 ModLauncher 的问题），所以这里直接把 common 已经抽好并
// 剥过嵌套类属性的字节按原路径放进 fabric 产物，由 Knot 正常加载。
// 只放 injections.json 列出的那些（运行时 Arclight 确定没有），不会与 Arclight 的
// spigot-api 重复 —— 探针 P2 的类唯一性断言覆盖这一点。
def runtimeClassDir = project(':common').layout.buildDirectory.dir('generated/runtime-classes/META-INF/paperarc/runtime')
def injectedFabricClasses = tasks.register('injectedFabricClasses', Copy) {
    dependsOn project(':common').tasks.named('embedRuntimeClasses')
    from(runtimeClassDir) { include 'org/bukkit/**' }
    // 还原 .classbytes -> .class（common 那边加后缀是为了躲开 remapJar 的重新落位）
    rename(/(.+)\.classbytes$/, '$1.class')
    into layout.buildDirectory.dir('generated/injected-classes')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

shadowJar {
    dependsOn injectedFabricClasses
    from injectedFabricClasses
    exclude 'architectury.common.json'
    // org/bukkit/** 由 Arclight 运行时提供；例外是上面那批运行时确实没有的类型
    exclude { it.path.startsWith('org/bukkit/') && !new File(injectedFabricClasses.get().destinationDir, it.path).isFile() }
    exclude 'module-info.class'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// CraftBukkit 包版本化：deobf v/ -> 运行时 v1_21_R1（含 mixin refmap）
tasks.register('versionCraftBukkit', com.ixnah.mc.paperarc.build.VersionCraftBukkitTask) {
    jar.set(remapJar.archiveFile)
    revision.set('v1_21_R1')
    mixinConfigs.set('')
}
tasks.matching { it.name == 'versionCraftBukkit' }.configureEach {
    mustRunAfter remapJar
    outputs.upToDateWhen { false }
}
// remapJar（tiny-remapper）会按类名里的 '$' 重新生成 InnerClasses/NestHost，
// 把 embedRuntimeClasses 剥掉的属性又加回来 —— 于是插件对注入类型调 getSimpleName()
// 依旧 IncompatibleClassChangeError。只能在最终产物上再剥一次。
tasks.register('stripInjectedNestAttributes') {
    dependsOn 'versionCraftBukkit'
    def jarFile = remapJar.archiveFile
    def injectedDir = injectedFabricClasses.map { it.destinationDir }
    outputs.upToDateWhen { false }
    doLast {
        def names = [] as Set
        injectedDir.get().eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.class')) {
                names << injectedDir.get().toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
            }
        }
        def target = jarFile.get().asFile
        def tmp = new File(target.parentFile, target.name + '.strip')
        int stripped = 0
        new java.util.zip.ZipFile(target).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(tmp.newOutputStream()).withCloseable { out ->
                zip.entries().each { entry ->
                    def bytes = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    if (names.contains(entry.name)) {
                        bytes = stripNestAttributes(entry.name[0..-7], bytes)
                        stripped++
                    }
                    out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    out.write(bytes)
                    out.closeEntry()
                }
            }
        }
        target.delete()
        tmp.renameTo(target)
        logger.lifecycle("stripInjectedNestAttributes: ${stripped} entries")
    }
}

/** 剥掉 internal 这个嵌套类自身的 InnerClasses 条目、EnclosingMethod 与 NestHost。 */
static byte[] stripNestAttributes(String internal, byte[] bytes) {
    if (!internal.contains('$')) {
        return bytes
    }
    def reader = new org.objectweb.asm.ClassReader(bytes)
    def writer = new org.objectweb.asm.ClassWriter(0)
    reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
        @Override
        void visitOuterClass(String owner, String methodName, String descriptor) {
        }

        @Override
        void visitNestHost(String nestHost) {
        }

        @Override
        void visitInnerClass(String innerName, String outerName, String simpleName, int access) {
            if (innerName != internal) {
                super.visitInnerClass(innerName, outerName, simpleName, access)
            }
        }
    }, 0)
    return writer.toByteArray()
}

tasks.named('build') {
    dependsOn 'versionCraftBukkit'
    dependsOn 'stripInjectedNestAttributes'
}
