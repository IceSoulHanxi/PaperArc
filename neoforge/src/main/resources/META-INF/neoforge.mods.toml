modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="paperarc"
version="${version}"
displayName="PaperArc"
description='''
Paper API compatibility layer for Arclight.
Implements the io.papermc.paper / com.destroystokyo.paper plugin API surface
on top of Arclight's Bukkit layer, without porting Paper's optimizations.
'''
authors="PaperArc Contributors"

# 由 generateAccessTransformer 从 common/src/main/resources/paperarc.accesswidener 生成。
# fabric.mod.json 的 accessWidener 只有 Fabric 认，loom 的 convertAccessWideners 只作用于开发期。
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="paperarc-common.mixins.json"

[[mixins]]
config="paperarc-mojmap.mixins.json"

[[dependencies.paperarc]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="SERVER"

[[dependencies.paperarc]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="SERVER"
