plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge libs.neoforge

    compileOnly libs.spigot.api
    compileOnly libs.paper.api
    // deobf spigot：CB 类引用（CraftBlock 等）编译需要，运行时由 versionCraftBukkit 版本化
    compileOnly "io.izzel.arclight.generated:spigot:1.21.1:deobf"

    // MixinExtras：NeoForge 20.4+ 运行时自带，仅需编译期 + 注解处理器
    compileOnly libs.mixinextras.neoforge
    annotationProcessor libs.mixinextras.neoforge

    // shade paper-api + adventure（shadowJar 中排除 org.bukkit，运行时用 Arclight 的）
    shadowCommon(libs.paper.api) { transitive = false }
    shadowCommon(libs.bundles.adventure) { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    exclude 'org/bukkit/**'
    // arclight 自身导出 org.spigotmc，重复导出会触发 JPMS ResolutionException
    exclude 'org/spigotmc/**'
    exclude 'module-info.class'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// CraftBukkit 包版本化：deobf v/ -> 运行时 v1_21_R1（含 mixin refmap）
tasks.register('versionCraftBukkit', dev.paperarc.build.VersionCraftBukkitTask) {
    jar.set(tasks.named('remapJar').flatMap { it.archiveFile })
    revision.set('v1_21_R1')
}
tasks.matching { it.name == 'versionCraftBukkit' }.configureEach {
    mustRunAfter tasks.named('remapJar')
    outputs.upToDateWhen { false }
}
tasks.named('build') {
    dependsOn 'versionCraftBukkit'
}
